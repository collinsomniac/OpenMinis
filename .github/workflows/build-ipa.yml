name: build-ipa

# Sideload build of the OpenMinis fork, for a free Apple ID (no Mac needed).
# 1. native deps (LAME, FFmpeg, iSH, Alpine rootfs, rclone) — slow the first time, then cached
# 2. scripts/prepare_sideload.py: main app only, own bundle id, signable entitlements + memory limit
# 3. unsigned build -> ad-hoc sign WITH entitlements (so the sideload signer requests them) -> IPA
# Install with the cable-free pipeline from collinsomniac/looplab (tools/deploy.py).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'src/android/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version || true

      - name: Tooling
        run: |
          brew install ninja llvm lld libarchive pkg-config go || true
          pip3 install --break-system-packages meson || pip3 install meson

      - name: Cache native deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: native-deps-v1-${{ hashFiles('deps/*.sh', '.gitmodules') }}-${{ hashFiles('deps/rclone-mobile/**') }}

      - name: Build native deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # Homebrew split lld out of llvm; the iSH VDSO links with -fuse-ld=lld
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          which ld.lld clang
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          ls -la deps/libs deps/frameworks deps/resources

      - name: Provider customization template
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Prepare for sideloading
        run: python3 scripts/prepare_sideload.py src/ios

      # 26 minutes of the 28-minute run was the Build step, and none of it was cached: every run
      # re-cloned and re-compiled mlx-swift (Metal kernels included), mlx-swift-lm, swift-transformers,
      # swift-huggingface and the whole app from cold. The native-dep cache below already works
      # ("Build native deps" shows as skipped), so the same treatment applies here.
      #
      # DerivedData holds the SwiftPM checkouts (SourcePackages) *and* every compiled artifact. A warm
      # restore turns the dependency rebuild into an incremental build. The key is deliberately
      # rolling: cache entries are immutable per key, so including the run number writes a fresh
      # snapshot each run while restore-keys fall back to the most recent one — that is what keeps the
      # hit rate high instead of freezing an ancient cache forever.
      - name: Cache Swift packages + DerivedData
        id: dd-cache
        uses: actions/cache@v4
        with:
          path: |
            build/dd/SourcePackages
            build/dd/Build
            build/dd/ModuleCache.noindex
          key: dd-v1-${{ hashFiles('src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'src/ios/Minis.xcodeproj/project.pbxproj') }}-${{ github.run_number }}
          restore-keys: |
            dd-v1-${{ hashFiles('src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'src/ios/Minis.xcodeproj/project.pbxproj') }}-
            dd-v1-

      - name: Build
        run: |
          set -o pipefail
          BUILD=${{ github.run_number }}
          # -skipMacroValidation: mlx-swift-lm vends Swift macros (MLXHuggingFaceMacros, which is what
          #   supplies #hubDownloader()/#huggingFaceTokenizerLoader()). Xcode refuses to run an
          #   untrusted macro package, and on a fresh CI runner nothing has been trusted yet.
          # -skipPackagePluginValidation: same class of gate for build plugins.
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -parallelizeTargets \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CURRENT_PROJECT_VERSION=$BUILD \
            'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -solver-expression-time-threshold=600 -Xfrontend -solver-memory-threshold=2000000000' \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -200

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app: $APP"
          # [T-ci-pack-stale-product] With a warm DerivedData cache a *previous* build's .app can be
          # sitting in the products directory. Packing that on a failed or partial build would ship the
          # old binary under the new release tag — the same mistake that once installed build 36 while
          # the release said 37. Assert the product is this run's before touching it.
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          if [ "$APP_BUILD" != "${{ github.run_number }}" ]; then
            echo "::error::refusing to package: product CFBundleVersion=$APP_BUILD but this run is ${{ github.run_number }}"
            exit 1
          fi
          # ad-hoc sign with the reduced entitlements so the sideload signer sees what to request
          codesign -f -s - --entitlements src/ios/Minis.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          zip -qry "OpenMinis-$VER-${{ github.run_number }}.ipa" Payload
          ls -la *.ipa
          echo "IPA=$(ls *.ipa)" >> $GITHUB_ENV

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "openminis-${{ github.run_number }}" "$IPA" \
            --title "openminis-${{ github.run_number }}" \
            --notes "Sideload build (main app only, bundle io.github.collinsomniac.openminis, increased-memory-limit). From ${{ github.sha }}."
