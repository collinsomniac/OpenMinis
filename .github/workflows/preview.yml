name: preview

# See the app without signing, without a Mac, and without installing to the phone.
#
# Why this works when the normal pipeline is blocked: a build for an **iOS Simulator** destination with
# CODE_SIGNING_ALLOWED=NO needs no certificate, no provisioning profile and no Apple servers at all. So
# this is immune to the Apple ID failures that block signing, and it is the closest thing to the
# terminal-and-a-live-server loop a web developer has.
#
# What comes out: PNG screenshots of the app running on an iPhone 18 Pro simulator (iOS 27.0 — already
# installed on the xcode-27 image), collected as an artifact, *and* pushed to a `preview` branch so the
# newest screenshots are viewable from the phone at
#     https://github.com/collinsomniac/OpenMinis/blob/preview/preview/index.html
#
# Two known limits, both worth knowing before reading a failure as a bug:
#  - **MLX does not run in the Simulator.** Any screen that touches the on-device engine will error or
#    show an empty state. This job answers the UI question, not the inference question.
#  - `simctl` cannot inject touches, so this captures the launch state only. Driving the app (taps,
#    typing, navigation, per-screen captures) needs XCUITest or `idb` — a later step.

on:
  workflow_dispatch:
    inputs:
      device:
        description: "simulator device name"
        required: false
        default: "iPhone 18 Pro"

permissions:
  contents: write

jobs:
  preview:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode + Metal toolchain
        run: |
          xcodebuild -version
          # mlx-swift's Cmlx target compiles .metal files, so the simulator build needs this too —
          # its absence fails the build with "cannot execute tool 'metal'".
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphonesimulator metal --version || true

      - name: Tooling
        run: |
          brew install ninja llvm lld libarchive pkg-config go || true
          pip3 install --break-system-packages meson || pip3 install meson

      # Same key as build-ipa.yml on purpose: whichever workflow ran last warms this for the other.
      - name: Cache native deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: native-deps-v1-${{ hashFiles('deps/*.sh', '.gitmodules') }}-${{ hashFiles('deps/rclone-mobile/**') }}

      - name: Build native deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Provider customization template
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Prepare project (main app only, consistent deployment targets)
        run: python3 scripts/prepare_sideload.py src/ios

      - name: Cache Swift packages + DerivedData
        uses: actions/cache@v4
        with:
          path: |
            build/dd/SourcePackages
            build/dd/Build
            build/dd/ModuleCache.noindex
            build/ccache
          key: pv-v1-${{ hashFiles('src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'src/ios/Minis.xcodeproj/project.pbxproj') }}-${{ github.run_number }}
          restore-keys: |
            pv-v1-${{ hashFiles('src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'src/ios/Minis.xcodeproj/project.pbxproj') }}-
            dd-v1-

      # No signing, no entitlements, no Apple account — this is the whole point.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ inputs.device }}" \
            -derivedDataPath build/dd \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log | tail -40

      - name: Screenshot the launch state
        run: |
          set +e
          mkdir -p preview
          DEV="${{ inputs.device }}"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app: $APP"
          if [ -n "$APP" ]; then
            BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
            echo "bundle id: $BID"
            xcrun simctl install booted "$APP" || true
            xcrun simctl launch --console booted "$BID" > launch.log 2>&1 || true
            sleep 12
            xcrun simctl io booted screenshot preview/01-launch.png || true
            # A second capture after the app settles; keeps a record of any launch-time error text.
            sleep 8
            xcrun simctl io booted screenshot preview/02-settled.png || true
          fi
          ls -la preview || true
          tail -30 launch.log 2>/dev/null || true

      - name: Build a phone-readable gallery
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, pathlib
          pathlib.Path('preview').mkdir(exist_ok=True)
          imgs = sorted(glob.glob('preview/*.png'))
          sha = os.environ.get('GITHUB_SHA', '')[:7]
          cards = "\n".join(
              f'<figure style="margin:0 0 24px"><img src="{os.path.basename(p)}" '
              f'style="width:100%;max-width:390px;border-radius:12px">'
              f'<figcaption style="font-size:12px;opacity:.6">{os.path.basename(p)}</figcaption></figure>'
              for p in imgs) or "<p>No screenshots were captured — check the build and launch logs.</p>"
          pathlib.Path('preview/index.html').write_text(
              "<html><head><meta name=viewport content='width=device-width,initial-scale=1'>"
              "<style>body{background:#111;color:#eee;font:15px -apple-system,system-ui;margin:24px}</style>"
              f"</head><body><h2>Build {sha}</h2>{cards}</body></html>")
          print(f"gallery: {len(imgs)} image(s)")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ github.run_number }}
          path: |
            preview/
            build.log
            launch.log
          retention-days: 20

      # The phone-friendly bit: a stable URL that always shows the newest capture.
      # Done in a scratch repository so it cannot touch this job's checkout.
      - name: Publish to the preview branch
        if: always()
        continue-on-error: true
        run: |
          set -e
          if [ ! -f preview/index.html ]; then echo "nothing to publish"; exit 0; fi
          rm -rf /tmp/pv && mkdir -p /tmp/pv && cd /tmp/pv
          git init -q
          cp -R "$GITHUB_WORKSPACE/preview/." .
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -qm "preview ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_NUMBER})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:preview
          echo "view: https://github.com/${GITHUB_REPOSITORY}/blob/preview/index.html"
